<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virtualisation</title>
    <link rel="stylesheet" href="../../../styles/index.css">
    <link rel="stylesheet" href="./virtualisation.css">
    <template id="card_template">
        <article class="card">
            <h2 class="card__title"></h2>
            <div class="card__body">
                <div class='card__body__image' aria-hidden="true"></div>
                <section class='card__body__content' contenteditable="true">
                </section>
            </div>
        </article>
    </template>
</head>
<body>
<main id="container">
    <h1>Virtualisation</h1>
</main>
</body>
<script type="module">
    import {VirtualList} from "./virtual-list.js";
    import {initMockDB} from "../../../utils/db.js";
    import {getOrUpdateCardElement} from "../../../utils/card.js";
    const container = document.body;
    const DB = initMockDB({title: 'Frontend System Design', body: 'Frontend System Design'});
    const template = document.getElementById('card_template');

    const getOrUpdateTemplate = (element, datum) => {
        return getOrUpdateCardElement(element, datum, { template });
    }

    const list = new VirtualList(container, {
        getPage: (p) => DB.getPage(p),
        getTemplate: getOrUpdateTemplate,
        updateTemplate: getOrUpdateTemplate,
        pageSize: 10
    });
    list.render();
</script>
</html>
