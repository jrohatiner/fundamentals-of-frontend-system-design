<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend System Design Fundamentals</title>
    <link rel="stylesheet" href="../../styles/index.css" />
    <link rel="stylesheet" href="./index.css" />
    <template id="card_template">
      <article class="card">
        <h3></h3>
        <div class="card__body">
          <div class="card__body__image"></div>
          <section class="card__body__content"></section>
        </div>
      </article>
    </template>
  </head>
  <body>
    <nav aria-label="Skip links">
      <a class="skip-link" href="#container">Skip to main content</a>
    </nav>
    <main id="container" tabindex="-1"></main>
    <script>
      const container = document.getElementById("container");
      function createCardElement(title, body) {
        const template = document.getElementById("card_template");
        const element = template.content.cloneNode(true).firstElementChild;
        const [cardTitle] = element.getElementsByTagName("h3");
        const [cardBody] = element.getElementsByTagName("section");
        [cardTitle.textContent, cardBody.textContent] = [title, body];
        return element;
      }
      container.appendChild(
        createCardElement(
          "Frontend System Design: Fundamentals",
          "This is a random content",
        ),
      );
    </script>
  </body>
</html>
