<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend System Design Fundamentals</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      #container {
        margin: 0 auto;
        width: 100%;
        max-width: 600px;
        padding: 1rem;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-row-gap: 2rem;
        grid-column-gap: 2rem;
      }
      @media (max-width: 480px) {
        #container {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .box {
        margin: 0;
        width: 100%;
        max-width: 100%;
        min-width: 100px;
        min-height: 100px;
        height: 100%;
        border: 2px solid black;
        resize: both;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .box:nth-child(1) {
        background: rgba(0, 255, 0, 0.5);
      }
      .box:nth-child(2) {
        background: rgba(255, 255, 0, 0.5);
      }
      .box:nth-child(3) {
        background: rgba(255, 0, 0, 0.5);
      }
      .box:nth-child(4) {
        background: rgba(0, 0, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <main id="container">
      <div class="box">A</div>
      <div class="box">B</div>
      <div class="box">C</div>
      <div class="box">D</div>
    </main>
    <script type="module">
      const observer = new ResizeObserver((entries) => {
        for (let entry of entries) {
          const { target } = entry;
          const boxSize = Array.isArray(entry.borderBoxSize)
            ? entry.borderBoxSize[0]
            : entry.borderBoxSize;
          const inlineSize =
            boxSize && boxSize.inlineSize != null
              ? boxSize.inlineSize
              : entry.contentRect && entry.contentRect.width;
          const blockSize =
            boxSize && boxSize.blockSize != null
              ? boxSize.blockSize
              : entry.contentRect && entry.contentRect.height;
          const isSmall = inlineSize < 150 && blockSize < 150;
          const nextState = isSmall ? "true" : "false";
          if (target.dataset.small === nextState) {
            continue;
          }
          const isInitialLarge = target.dataset.small === undefined && !isSmall;
          target.dataset.small = nextState;
          if (isInitialLarge) {
            continue;
          }
          if (isSmall) {
            target.style.borderRadius = "100%";
            target.style.borderWidth = "4px";
          } else {
            target.style.borderRadius = "unset";
            target.style.borderWidth = "unset";
          }
        }
      });
      const elements = document.querySelectorAll(".box");
      elements.forEach((el) => observer.observe(el, { box: "border-box" }));
    </script>
  </body>
</html>
