<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend System Design Fundamentals</title>
    <link rel="stylesheet" href="../../styles/index.css" />
    <template id="card_template">
      <article class="card">
        <h3 class="card__title"></h3>
        <div class="card__body">
          <div class="card__body__image"></div>
          <section class="card__body__content" contenteditable="true"></section>
        </div>
      </article>
    </template>
  </head>
  <body>
    <main id="container">
      <div
        id="feed-status"
        class="sr-only"
        role="status"
        aria-live="polite"
      ></div>
      <div id="list"></div>
      <div id="bottom-observer" aria-hidden="true">Bottom Observer</div>
    </main>
    <script type="module">
      import {
        createCardElement,
        getHeading,
        HEADING_COMMAND_REGEX,
      } from "./utils.js";
      import { initMockDB } from "../../utils/db.js";

      const db = initMockDB({
        title: "Fundamentals of Frontend System Design",
        body: "Learning to use Intersection Observer",
      });
      const list = document.getElementById("list");
      const observerElement = document.getElementById("bottom-observer");
      const statusElement = document.getElementById("feed-status");

      const mutationObserver = new MutationObserver((mutations) => {
        for (const { target, type } of mutations) {
          const contentContainer = target?.parentElement?.closest(
            ".card__body__content",
          );
          if (
            type === "characterData" &&
            target.isConnected &&
            contentContainer?.isContentEditable &&
            target.parentElement?.isContentEditable &&
            !target.parentElement.closest(
              ".card__body__content h1, .card__body__content h2, .card__body__content h3",
            ) &&
            HEADING_COMMAND_REGEX.test(target?.textContent ?? "")
          ) {
            const element = getHeading(target);
            target.replaceWith(element);
            element.focus();
            const selection = window.getSelection();
            if (selection) {
              const range = document.createRange();
              if (element.lastChild?.nodeType === Node.TEXT_NODE) {
                range.setStart(element.lastChild, element.lastChild.length);
              } else {
                range.setStart(element, 0);
              }
              range.collapse(true);
              selection.removeAllRanges();
              selection.addRange(range);
            }
          }
        }
      });
      mutationObserver.observe(list, { characterData: true, subtree: true });

      let page = 0;
      let isLoading = false;
      let clearStatusTimer = null;

      function updateStatus(message) {
        if (!statusElement) {
          return;
        }
        if (clearStatusTimer !== null) {
          clearTimeout(clearStatusTimer);
          clearStatusTimer = null;
        }
        statusElement.textContent = message;
      }

      function scheduleStatusClear(delayMs = 1500) {
        if (!statusElement) {
          return;
        }
        if (clearStatusTimer !== null) {
          clearTimeout(clearStatusTimer);
        }
        clearStatusTimer = setTimeout(() => {
          clearStatusTimer = null;
          if (!isLoading) {
            statusElement.textContent = "";
          }
        }, delayMs);
      }

      const observer = new IntersectionObserver(
        async ([bottom]) => {
          if (bottom.isIntersecting && !isLoading) {
            isLoading = true;
            observerElement.textContent = "Loading";
            updateStatus("Loading more items...");
            try {
              const data = await db.getPage(page++);
              if (!data?.length) {
                observerElement.textContent = "End of feed";
                observer.unobserve(observerElement);
                updateStatus("No more items to load.");
                scheduleStatusClear();
                return;
              }
              const fragment = new DocumentFragment();
              data.forEach(({ title, body }) => {
                const card = createCardElement(title, body);
                fragment.appendChild(card);
              });

              list.appendChild(fragment);
              observerElement.textContent = "Bottom Observer";
              updateStatus(`Loaded ${data.length} items.`);
              scheduleStatusClear();
            } catch (error) {
              observerElement.textContent = "Bottom Observer";
              updateStatus("");
              throw error;
            } finally {
              isLoading = false;
            }
          }
        },
        { threshold: 0.1 },
      );
      observer.observe(observerElement);
    </script>
  </body>
</html>
