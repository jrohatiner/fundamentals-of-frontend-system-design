<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frontend System Design Fundamentals</title>
    <link rel="stylesheet" href="../../styles/index.css">
    <template id="card_template">
        <article class="card">
            <h3 class="card__title"></h3>
            <div class="card__body">
                <div class='card__body__image'></div>
                <section class='card__body__content'>
                </section>
            </div>
        </article>
    </template>
</head>
<body>
<main id="container">
    <div id="feed-status" class="sr-only" role="status" aria-live="polite"></div>
    <div id="list"></div>
    <div id="bottom-observer" aria-hidden="true">
        Bottom Observer
    </div>
</main>
<script type="module">
    import {initMockDB} from "../../utils/db.js";

    const [template, list, observerElement] = document.querySelectorAll("#card_template, #list, #bottom-observer");
    const statusElement = document.getElementById("feed-status");

    const db = initMockDB({
        title: "Fundamentals of Frontend System Design",
        body: "Learning to use Intersection Observer"
    });

    function createCardElement(title, body) {
        const element = template.content.cloneNode(true).firstElementChild;
        const [cardTitle, cardBody] = element.querySelectorAll('.card__title, .card__body__content');
        [cardTitle.textContent, cardBody.textContent] = [title, body];
        return element;
    }

    /**
     * Exercise - Intersection Observer
     * 1. Create Intersection observer instance and provide a callback to it
     * 2. In the callback use mock db - next function to get the next chunk of data
     * 3. Create a fragment where you chunk all your DOM Mutations
     * 4. Update fragment
     * 5. Append fragment to "list" container
     */
    let page = 0;
    let isLoading = false;
    let clearStatusTimer = null;

    function updateStatus(message) {
        if (!statusElement) {
            return;
        }
        if (clearStatusTimer !== null) {
            clearTimeout(clearStatusTimer);
            clearStatusTimer = null;
        }
        statusElement.textContent = message;
    }

    function scheduleStatusClear(delayMs = 1500) {
        if (!statusElement) {
            return;
        }
        if (clearStatusTimer !== null) {
            clearTimeout(clearStatusTimer);
        }
        clearStatusTimer = setTimeout(() => {
            clearStatusTimer = null;
            if (!isLoading) {
                statusElement.textContent = "";
            }
        }, delayMs);
    }

    const observer = new IntersectionObserver(async ([entry]) => {
        if (entry.isIntersecting && !isLoading) {
            isLoading = true;
            updateStatus("Loading more items...");
            try {
                const data = await db.getPage(page++);
                if (!data?.length) {
                    observer.unobserve(observerElement);
                    observerElement.textContent = "No more items to load";
                    updateStatus("No more items to load.");
                    scheduleStatusClear();
                    return;
                }
                const fragment = new DocumentFragment();
                data.forEach(({title, body}) => {
                    const card = createCardElement(title, body);
                    fragment.appendChild(card);
                });
                list.appendChild(fragment);
                updateStatus(`Loaded ${data.length} items.`);
                scheduleStatusClear();
            } catch (error) {
                updateStatus("");
                throw error;
            } finally {
                isLoading = false;
            }
        }
    }, {
        threshold: 0.2
    })

    observer.observe(observerElement)

</script>
</body>
</html>
