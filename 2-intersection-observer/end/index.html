<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend System Design Fundamentals</title>
    <link rel="stylesheet" href="../../styles/index.css" />
    <template id="card_template">
      <article class="card">
        <h2 class="card__title"></h2>
        <div class="card__body">
          <div class="card__body__image" aria-hidden="true"></div>
          <section class="card__body__content"></section>
        </div>
      </article>
    </template>
  </head>
  <body>
    <main id="container">
      <h1>Frontend System Design Fundamentals</h1>
      <div id="list"></div>
      <div id="bottom-observer">Bottom Observer</div>
    </main>
    <script type="module">
      import { initMockDB } from "../../utils/db.js";
      import { createCardElement } from "../../utils/card.js";

      const [template, list, observerElement] = document.querySelectorAll(
        "#card_template, #list, #bottom-observer",
      );

      const db = initMockDB({
        title: "Fundamentals of Frontend System Design",
        body: "Learning to use Intersection Observer",
      });

      /**
       * Exercise - Intersection Observer
       * 1. Create Intersection observer instance and provide a callback to it
       * 2. In the callback use mock db - next function to get the next chunk of data
       * 3. Create a fragment where you chunk all your DOM Mutations
       * 4. Update fragment
       * 5. Append fragment to "list" container
       */
      let page = 0;
      let isLoading = false;
      const observer = new IntersectionObserver(
        async ([entry]) => {
          if (entry.isIntersecting && !isLoading) {
            isLoading = true;
            try {
              const data = await db.getPage(page++);
              if (data.length === 0) {
                observer.unobserve(observerElement);
                observerElement.textContent = "No more items to load";
                return;
              }
              const fragment = new DocumentFragment();
              data.forEach(({ title, body, alt, headingLevel }) => {
                const card = createCardElement(title, body, {
                  alt,
                  headingLevel,
                  template,
                });
                fragment.appendChild(card);
              });
              list.appendChild(fragment);
            } finally {
              isLoading = false;
            }
          }
        },
        {
          threshold: 0.2,
        },
      );

      observer.observe(observerElement);
    </script>
  </body>
</html>
